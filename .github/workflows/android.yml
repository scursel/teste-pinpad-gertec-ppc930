name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # o runner ubuntu-latest ja traz o Android SDK (ANDROID_HOME)
      - name: Testes do protocolo (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compila o APK de debug
        run: ./gradlew --no-daemon assembleDebug
