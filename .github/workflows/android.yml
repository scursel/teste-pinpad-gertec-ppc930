name: android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  # publicar pelo botao "Run workflow" (Actions) sem precisar enviar a tag
  workflow_dispatch:
    inputs:
      versao:
        description: "Tag do Release (ex.: v1.1) - criada no commit escolhido"
        required: true

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # o runner ubuntu-latest ja traz o Android SDK (ANDROID_HOME)
      - name: Testes do protocolo (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compila o APK de debug
        run: ./gradlew --no-daemon assembleDebug

  # Tag v* (ex.: v1.1) -> compila e publica o APK num Release do GitHub.
  # Com os secrets PINPAD_KEYSTORE_B64/PINPAD_KEYSTORE_PASS/PINPAD_KEY_ALIAS/PINPAD_KEY_PASS
  # o APK sai assinado em modo release; sem eles, sai o APK de debug (instalavel, mas debuggable).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Compila o APK
        env:
          KEYSTORE_B64: ${{ secrets.PINPAD_KEYSTORE_B64 }}
          PINPAD_KEYSTORE_PASS: ${{ secrets.PINPAD_KEYSTORE_PASS }}
          PINPAD_KEY_ALIAS: ${{ secrets.PINPAD_KEY_ALIAS }}
          PINPAD_KEY_PASS: ${{ secrets.PINPAD_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export PINPAD_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../teste-pinpad-ppc930.apk
          else
            echo "::warning::sem chave release nos secrets - publicando o APK de debug"
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../teste-pinpad-ppc930.apk
          fi
      - name: Publica o Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao || github.ref_name }}
        run: |
          gh release create "$VERSAO" ../teste-pinpad-ppc930.apk --target "$GITHUB_SHA" \
            --title "$VERSAO" --notes-file ../CHANGELOG.md --latest
